name: Docker Build -> Push -> Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: checkout code
      run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)

    - name: setup java background
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '25'

    - name: building jar 
      run: ./mvnw clean package -DskipTests

    - name: login to docker hub
      run: docker login -u "${{secrets.DOCKER_USERNAME}}" --password-stdin 

    - name: Build Docker image
      run: docker build -t ${{secrets.DOCKER_USERNAME}}/spring-boot-ci-demo:latest

    - name: Push image to docker hub
      run: docker push  ${{secrets.DOCKER_USERNAME}}/spring-boot-ci-demo:latest

    - name: ssh and deploy to ec2
      uses: appleboy/ssh-action@v1
      with:
  +     host: "${{SECRETS.EC2_HOST}}"
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker stop sring-demo || true
          docker rm spring-demo || true 
          docker pull ${{secrets.DOCKER_USERNAME}}/spring-boot-ci-demo:latest
          docker run -d --name spring-demo -p 8080:8080 ${{secrets.DOCKER_USERNAME}}/spring-boot-ci-demo:latest
          
    
